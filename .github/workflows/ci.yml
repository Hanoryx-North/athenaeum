name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GitHub-hosted runners intermittently hit crates.io HTTP/2 stream resets on
  # large dependency graphs. Retries plus HTTP/1.1 make this far less flaky.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "5"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Tauri's crate is a workspace member, so even `cargo clippy` needs the
      # Linux webview headers present.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # LanceDB's build script compiles .proto definitions.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: cargo fmt --all --check

      # Warnings fail the build here rather than accumulating until nobody
      # reads the output any more.
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test -p athenaeum-core -p athenaeum-cli --all-targets
      - run: cargo build -p athenaeum-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:packages
      - run: python3 validation/verify_all.py --only product-cli,product-engine,product-repository,product-knowledge,product-boundaries,product-protocol,product-mcp-desktop,product-agent-to-knowledge,product-codex-memory,agent --fail-on-skip

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:packages
      - run: npm run check:packages
      - run: npm run build
      - run: npm test
      - run: python3 validation/verify_all.py --only protocol --fail-on-skip
