name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "5"

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 — the primary download.
          - platform: windows-latest
            label: Windows (x86_64)
            args: "--target x86_64-pc-windows-msvc"
            rust_target: x86_64-pc-windows-msvc

          # Apple silicon and Intel are separate bundles rather than a
          # universal binary, so each download stays half the size.
          - platform: macos-latest
            label: macOS (Apple silicon)
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin

          # Native ARM Linux runner — no cross-compiling webkit2gtk.
          - platform: ubuntu-22.04
            label: Linux (x86_64)
            args: ""
            rust_target: ""
          - platform: ubuntu-22.04-arm
            label: Linux (arm64)
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils is pre-installed on the x86_64 image but not the ARM
          # one, and the AppImage bundler embeds it. Name it explicitly so
          # both architectures bundle identically.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      # LanceDB's build script compiles .proto definitions.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is optional: unset secrets simply produce unsigned
          # bundles rather than failing the build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # A tag push publishes a real release. A manual run leaves these
          # empty, so tauri-action skips the upload and just leaves bundles
          # behind for testing a branch.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('Athenaeum {0}', github.ref_name) || '' }}
          releaseBody: "See the assets below for downloads."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload bundles (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.rust_target || matrix.platform }}
          # Covers both targeted (target/<triple>/release/…) and default
          # (target/release/…) output paths.
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14
