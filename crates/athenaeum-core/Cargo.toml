[package]
name = "athenaeum-core"
description = "The Athenaeum knowledge library: nodes, typed edges, evidence, provenance and graph navigation over a local SQLite store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `bundled` compiles SQLite from source and links it statically. That is the
# single most important dependency choice in this workspace: it means the
# Windows x86_64, macOS arm64 and Linux builds all talk to the *same* SQLite,
# with FTS5 always present, instead of whatever the host happens to ship.
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Real parsers, used for the languages where a line reader is not good enough.
# The grammars are compiled from C sources by their own build scripts; they add
# build time and nothing at runtime — no network, no shared library, no service.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"

[dev-dependencies]
tempfile = "3"
