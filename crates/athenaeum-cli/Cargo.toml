[package]
name = "athenaeum-cli"
description = "Command-line access to an Athenaeum knowledge base."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "athenaeum"
path = "src/main.rs"

[[bin]]
name = "wiki"
path = "src/wiki.rs"

[dependencies]
athenaeum-core = { path = "../athenaeum-core" }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# The Library client. Blocking, because the CLI is a one-shot process and an async runtime would
# buy nothing; rustls, because the workspace never links the platform TLS (see AGENTS.md).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
